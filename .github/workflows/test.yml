name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install pytest pytest-asyncio ruff

      # Tests marked `sj` publish into a real sjd. They need sj-client (installed separately)
      # and SJ builds, so they run in the local gate only and are deselected here, explicitly.
      - name: Run tests (SJ-marked integration tests deselected; they run in the local gate)
        run: uv run python -m pytest tests/ -q --tb=short -m "not sj"

      - name: Lint
        run: uv run ruff check alexandria/
        if: matrix.python-version == '3.12'
